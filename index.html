<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CIM · Crypto Intelligence Matrix</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<header id="topbar">
  <span class="logo-mark">CIM</span>
  <span class="status" id="status"><span class="dot" id="status-dot"></span><span id="status-text">Starting…</span></span>
  <span class="version" id="app-version"></span>
  <button id="refresh-btn" class="icon-btn" aria-label="Refresh data">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
  </button>
</header>

<div id="pulse" class="pulse-row" aria-label="Market pulse"></div>

<nav id="tabbar" aria-label="Sections">
  <button class="tab" data-tab="grid">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Grid</span></button>
  <button class="tab" data-tab="signals">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
    <span>Signals</span></button>
  <button class="tab" data-tab="settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.9 2.9M16.9 16.9l2.9 2.9M1 12h4M19 12h4M4.2 19.8l2.9-2.9M16.9 7.1l2.9-2.9"/></svg>
    <span>Settings</span></button>
</nav>

<main>
  <section id="tab-grid" class="tab-panel">
    <div class="seg" role="group" aria-label="Grid type">
      <button class="seg-btn" data-mode="spot" aria-pressed="true">Spot</button>
      <button class="seg-btn" data-mode="futures" aria-pressed="false">Futures</button>
    </div>
    <div id="grid-list" class="list"></div>
  </section>

  <section id="tab-signals" class="tab-panel" hidden>
    <p class="foot">Direction bias — context for choosing a futures grid side. Not trade entries.</p>
    <div id="signal-list" class="list"></div>
  </section>

  <section id="tab-settings" class="tab-panel" hidden>
    <div class="settings">
      <div class="field"><label for="set-capital">Investment<small>USDT per grid bot</small></label>
        <input id="set-capital" class="input" type="number" inputmode="decimal" min="10" step="10"></div>
      <div class="field"><label for="set-leverage">Futures leverage<small>Drives the liquidation estimate</small></label>
        <input id="set-leverage" class="input" type="number" inputmode="decimal" min="1" max="100" step="1"></div>
      <div class="field"><label for="set-fee-spot">Spot fee %<small>Per side · Pionex 0.05</small></label>
        <input id="set-fee-spot" class="input" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div class="field"><label for="set-fee-futures">Futures fee %<small>Per side</small></label>
        <input id="set-fee-futures" class="input" type="number" inputmode="decimal" min="0" step="0.01"></div>
      <div class="field col">
        <label for="ticker-add-input">Tickers</label>
        <div id="ticker-chips" class="chips"></div>
        <div class="add-row">
          <input id="ticker-add-input" class="input" type="text" maxlength="12" placeholder="e.g. DOT" autocapitalize="characters" autocomplete="off" spellcheck="false">
          <button id="btn-add-ticker" class="btn primary">Add</button>
        </div>
        <span id="ticker-add-msg" class="sheet-note" role="status"></span>
      </div>
      <details class="fold"><summary>Indicator glossary</summary><div id="legend-grid"></div></details>
      <p class="foot">Data: Binance Futures (primary) · Bybit V5 (fallback). All maths runs in your browser on 4H candles. Refreshes every 20 min and whenever you come back to the app.</p>
    </div>
  </section>
</main>

<div id="sheet-backdrop" class="sheet-backdrop"></div>
<div id="bottom-sheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title-text" tabindex="-1">
  <div id="sheet-grab" class="sheet-grab">
    <div class="sheet-handle"></div>
    <div class="sheet-title">
      <span id="sheet-title-text"></span><span id="sheet-title-badge"></span>
      <button id="sheet-close" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div id="sheet-content"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
